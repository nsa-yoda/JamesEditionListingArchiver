<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Listing archive</title>
  <style>
    :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
    body { max-width: 56rem; margin: 0 auto; padding: 2rem 1rem 4rem; }
    header { border-bottom: 1px solid #8886; margin-bottom: 1.5rem; }
    h1 { font-size: 1.4rem; overflow-wrap: anywhere; }
    h2 { font-size: 1rem; margin-top: 2rem; }
    ul { list-style: none; padding: 0; }
    li { border-bottom: 1px solid #8884; }
    a { display: flex; gap: .75rem; padding: .7rem .25rem; text-decoration: none; }
    a:hover { background: #8882; }
    .kind { width: 1.5rem; color: #777; }
    .name { flex: 1; overflow-wrap: anywhere; }
    .meta { color: #777; font-size: .85rem; }
    .listing { border-bottom: 1px solid #8886; padding-bottom: 1.5rem; }
    .listing h2 { font-size: 1.3rem; }
    dl { display: grid; grid-template-columns: minmax(8rem, 12rem) 1fr; gap: .45rem 1rem; }
    dt { color: #777; }
    dd { margin: 0; overflow-wrap: anywhere; }
    dd a { display: inline; padding: 0; }
    .features { display: flex; flex-wrap: wrap; gap: .4rem; }
    .features li { border: 1px solid #8885; border-radius: 1rem; padding: .3rem .65rem; }
    .description { line-height: 1.55; white-space: pre-wrap; }
    .listing-toolbar { position: sticky; top: 0; z-index: 10; display: flex; flex-wrap: wrap; gap: .5rem; padding: .75rem 0; background: color-mix(in srgb, canvas 92%, transparent); backdrop-filter: blur(6px); border-bottom: 1px solid #8884; }
    .listing-toolbar button { border: 1px solid #8885; background: transparent; color: inherit; border-radius: 999px; padding: .35rem .7rem; cursor: pointer; }
    .listing-toolbar button[data-active="true"] { background: #8883; }
    .toolbar-count { color: #777; align-self: center; }
    .media-gallery { display: grid; gap: 30px; width: 100vw; margin: 2rem 0 0 calc(50% - 50vw); }
    .media-gallery figure { margin: 0; }
    .media-frame { width: 100%; max-height: min(80vh, 56rem); min-height: 20rem; background: #111; display: flex; align-items: center; justify-content: center; overflow: hidden; }
    .media-frame a { display: block; width: 100%; height: 100%; padding: 0; }
    .media-frame img { display: block; width: 100%; height: 100%; object-fit: contain; }
    .media-player, .media-player.video-js, .media-player video { display: block; width: 100%; height: 100%; }
    .media-player video { background: #000; }
    .media-item[hidden], .warning-item[hidden], .media-gallery figure[hidden], .media-heading[hidden], details[hidden] { display: none !important; }
    .copy-link { margin-left: .6rem; border: 1px solid #8885; background: transparent; color: inherit; border-radius: .4rem; padding: .15rem .4rem; cursor: pointer; }
    details { margin-top: 1.5rem; }
    #error { border: 1px solid #b44; padding: 1rem; white-space: pre-wrap; }
    footer { color: #777; font-size: .8rem; margin-top: 2rem; }
  </style>
</head>
<body>
  <header>
    <h1 id="path">Listing archive</h1>
    <p><a id="parent" href="../index.html" hidden>← Parent directory</a></p>
  </header>
  <main id="content">
    <p>Loading archive index…</p>
  </main>
  <footer id="updated"></footer>
  <script>
    const content = document.querySelector("#content");
    const escapeText = value => document.createTextNode(value);
    const formatBytes = bytes => {
      if (!Number.isFinite(bytes)) return "";
      const units = ["B", "KB", "MB", "GB"];
      let value = bytes, unit = 0;
      while (value >= 1024 && unit < units.length - 1) { value /= 1024; unit++; }
      return `${value.toFixed(unit ? 1 : 0)} ${units[unit]}`;
    };
    const displayNumber = value => Number.isFinite(value) ? String(value) : "";
    const displayMoney = value => value && (value.display || [displayNumber(value.amount), value.currency].filter(Boolean).join(" "));
    const displayUnitPrice = value => value && (value.display || [displayNumber(value.amount), value.currency, value.per_unit && `per ${value.per_unit}`].filter(Boolean).join(" "));
    const displayMeasurement = value => value && (value.display || [displayNumber(value.value), value.unit].filter(Boolean).join(" "));
    const displayPath = value => value && value !== "." ? value.split("/").filter(Boolean).join(" > ") : "Archive root";
    const externalLink = href => {
      const link = document.createElement("a");
      link.href = href;
      link.target = "_blank";
      link.rel = "noopener";
      return link;
    };
    const addField = (list, label, value, href) => {
      if (value === undefined || value === null || value === "") return;
      const term = document.createElement("dt");
      term.textContent = label;
      const detail = document.createElement("dd");
      if (href) {
        const link = externalLink(href);
        link.textContent = value;
        detail.append(link);
      } else {
        detail.textContent = value;
      }
      list.append(term, detail);
    };
    const addCopyButton = (container, value) => {
      if (!value) return;
      const button = document.createElement("button");
      button.type = "button";
      button.className = "copy-link";
      button.textContent = "Copy URL";
      button.addEventListener("click", () => navigator.clipboard?.writeText(value).then(() => {
        button.textContent = "Copied";
        setTimeout(() => { button.textContent = "Copy URL"; }, 1200);
      }).catch(() => {
        button.textContent = "Copy failed";
        setTimeout(() => { button.textContent = "Copy URL"; }, 1200);
      }));
      container.append(button);
    };
    const mediaDetails = (title, items, subdir) => {
      if (!items?.length) return null;
      const details = document.createElement("details");
      details.dataset.kind = subdir;
      const summary = document.createElement("summary");
      summary.textContent = `${title} (${items.length})`;
      const list = document.createElement("ul");
      items.forEach((item, index) => {
        const entry = document.createElement("li");
        entry.className = "media-item";
        entry.dataset.kind = subdir;
        entry.dataset.status = item.error ? "failed" : (item.status || (item.file ? "existing" : "discovered"));
        const href = item.file ? `${subdir}/${item.file}` : item.source_url;
        const link = item.file ? document.createElement("a") : externalLink(href);
        link.href = href;
        link.textContent = item.file || item.source_url || `${title} ${index + 1}`;
        entry.append(link);
        addCopyButton(entry, item.source_url);
        const metadata = [item.media_type, Number.isFinite(item.bytes) && item.bytes > 0 ? formatBytes(item.bytes) : ""].filter(Boolean).join(", ");
        if (metadata) entry.append(escapeText(` — ${metadata}`));
        if (item.status) entry.append(escapeText(` — ${item.status}`));
        if (item.error) entry.append(escapeText(` — ${item.error}`));
        list.append(entry);
      });
      details.append(summary, list);
      return details;
    };
    const mediaGallery = (listing, title, items, subdir, tagName) => {
      if (!items?.length) return [];
      const heading = document.createElement("h2");
      heading.className = "media-heading";
      heading.dataset.kind = subdir;
      heading.textContent = `${title} (${items.length})`;
      const gallery = document.createElement("section");
      gallery.className = "media-gallery";
      gallery.dataset.kind = subdir;
      gallery.setAttribute("aria-label", `Listing ${title.toLowerCase()}`);
      items.forEach((item, index) => {
        const source = item.file ? `${subdir}/${item.file}` : item.source_url;
        if (!source) return;
        const figure = document.createElement("figure");
        figure.dataset.kind = subdir;
        figure.dataset.status = item.error ? "failed" : (item.status || (item.file ? "existing" : "discovered"));
        const frame = document.createElement("div");
        frame.className = "media-frame";
        if (tagName === "video") {
          const video = document.createElement("video");
          video.className = "media-player video-js vjs-default-skin";
          video.src = source;
          if (item.poster_file) video.poster = `videos/${item.poster_file}`;
          video.controls = true;
          video.preload = "metadata";
          video.playsInline = true;
          video.setAttribute("aria-label", `${listing.property?.title || "Listing"} video ${index + 1}`);
          frame.append(video);
        } else {
          const link = document.createElement("a");
          link.href = source;
          const image = document.createElement("img");
          image.src = source;
          image.alt = `${listing.property?.title || "Listing"} image ${index + 1}`;
          image.loading = "lazy";
          image.decoding = "async";
          link.append(image);
          frame.append(link);
        }
        figure.append(frame);
        gallery.append(figure);
      });
      return gallery.childElementCount ? [heading, gallery] : [];
    };
    const applyListingFilter = value => {
      document.querySelectorAll("[data-filter-button]").forEach(button => {
        button.dataset.active = String(button.dataset.filterButton === value);
      });
      const showAll = value === "all";
      document.querySelectorAll(".media-item, .media-gallery figure").forEach(node => {
        const kind = node.dataset.kind;
        const status = node.dataset.status;
        const show = showAll ||
          (value === "images" && kind === "images") ||
          (value === "videos" && kind === "videos") ||
          (value === "failed" && status === "failed");
        node.hidden = !show;
      });
      document.querySelectorAll(".media-heading, details[data-kind]").forEach(node => {
        const kind = node.dataset.kind;
        const show = showAll ||
          (value === "images" && kind === "images") ||
          (value === "videos" && kind === "videos") ||
          (value === "failed" && (kind === "images" || kind === "videos")) ||
          (value === "warnings" && kind === "warnings");
        node.hidden = !show;
      });
      document.querySelectorAll(".warning-item").forEach(node => {
        node.hidden = !(showAll || value === "warnings");
      });
      const warningsDetails = document.querySelector("details[data-kind='warnings']");
      if (warningsDetails) warningsDetails.hidden = !(showAll || value === "warnings");
      document.querySelectorAll(".media-gallery").forEach(gallery => {
        const visible = Array.from(gallery.children).some(child => !child.hidden);
        gallery.hidden = !visible;
      });
      document.querySelectorAll(".media-heading").forEach(heading => {
        const next = heading.nextElementSibling;
        heading.hidden = !next || next.hidden;
      });
      const count = document.querySelector(".toolbar-count");
      if (count) {
        const visibleMedia = document.querySelectorAll(".media-item:not([hidden]), .media-gallery figure:not([hidden])").length;
        const visibleWarnings = document.querySelectorAll(".warning-item:not([hidden])").length;
        count.textContent = `${visibleMedia} visible media item(s), ${visibleWarnings} warning(s)`;
      }
    };
    const listingToolbar = listing => {
      const assets = [...(listing.videos || []), ...(listing.images || [])];
      if (!assets.length && !(listing.warnings || []).length) return null;
      const toolbar = document.createElement("section");
      toolbar.className = "listing-toolbar";
      [
        ["all", "All"],
        ["videos", "Videos"],
        ["images", "Images"],
        ["failed", "Failures"],
        ["warnings", "Warnings"]
      ].forEach(([value, label], index) => {
        const button = document.createElement("button");
        button.type = "button";
        button.dataset.filterButton = value;
        button.dataset.active = String(index === 0);
        button.textContent = label;
        button.addEventListener("click", () => applyListingFilter(value));
        toolbar.append(button);
      });
      const count = document.createElement("span");
      count.className = "toolbar-count";
      toolbar.append(count);
      return toolbar;
    };
    const ensureVideoJS = () => {
      if (document.querySelector('script[data-videojs-local]')) return Promise.resolve(window.videojs);
      if (!document.querySelector('link[data-videojs-local]')) {
        const link = document.createElement("link");
        link.rel = "stylesheet";
        link.href = "./video-js.min.css";
        link.dataset.videojsLocal = "true";
        document.head.append(link);
      }
      return new Promise((resolve, reject) => {
        if (window.videojs) {
          resolve(window.videojs);
          return;
        }
        const existing = document.querySelector('script[data-videojs-local]');
        if (existing) {
          existing.addEventListener("load", () => resolve(window.videojs), { once: true });
          existing.addEventListener("error", () => reject(new Error("video.min.js could not be loaded")), { once: true });
          return;
        }
        const script = document.createElement("script");
        script.src = "./video.min.js";
        script.dataset.videojsLocal = "true";
        script.onload = () => window.videojs
          ? resolve(window.videojs)
          : reject(new Error("video.min.js did not define videojs"));
        script.onerror = () => reject(new Error("video.min.js could not be loaded"));
        document.head.append(script);
      });
    };
    const upgradeVideos = () => {
      const videos = document.querySelectorAll("video.video-js");
      if (!videos.length) return;
      ensureVideoJS().then(videojs => {
        videos.forEach(video => {
          if (!video.dataset.videojsUpgraded) {
            video.dataset.videojsUpgraded = "true";
            videojs(video, { controls: true, preload: "metadata", fluid: true, controlBar: { volumePanel: { inline: false } } });
          }
        });
      }).catch(() => {});
    };
    const renderListing = listing => {
      const wrapper = document.createElement("article");
      wrapper.className = "listing";
      const title = document.createElement("h2");
      title.textContent = listing.property?.title || listing.location?.address || "Archived listing";
      wrapper.append(title);
      const toolbar = listingToolbar(listing);
      if (toolbar) wrapper.append(toolbar);

      const fields = document.createElement("dl");
      addField(fields, "Price", displayMoney(listing.property?.price));
      addField(fields, "Price per area", displayUnitPrice(listing.property?.price_per_area));
      addField(fields, "Type", listing.property?.type);
      addField(fields, "Availability", listing.property?.availability);
      addField(fields, "Bedrooms", displayNumber(listing.property?.bedrooms));
      addField(fields, "Bathrooms", displayNumber(listing.property?.bathrooms));
      addField(fields, "Floors", displayNumber(listing.property?.floors));
      addField(fields, "Interior area", displayMeasurement(listing.property?.interior_area));
      addField(fields, "Lot area", displayMeasurement(listing.property?.lot_area));
      addField(fields, "Year built", displayNumber(listing.property?.year_built));
      addField(fields, "Source photo count", displayNumber(listing.property?.photo_count));
      addField(fields, "Address", listing.location?.address);
      addField(fields, "Street", listing.location?.street);
      addField(fields, "Municipality", listing.location?.municipality);
      addField(fields, "Region", listing.location?.region);
      addField(fields, "Postal code", listing.location?.postal_code);
      addField(fields, "Country", listing.location?.country);
      addField(fields, "Coordinates", listing.location?.latitude != null && listing.location?.longitude != null ? `${listing.location.latitude}, ${listing.location.longitude}` : "");
      addField(fields, "Map", listing.location?.map_url, listing.location?.map_url);
      addField(fields, "Video", listing.property?.video_url, listing.property?.video_url);
      addField(fields, "Site listing ID", listing.source?.listing_id);
      addField(fields, "Listing reference", listing.source?.listing_reference);
      addField(fields, "First listed", listing.source?.first_listed);
      addField(fields, "Last updated", listing.source?.last_updated);
      addField(fields, "Retrieved", listing.source?.retrieved_at);
      addField(fields, "Site", listing.source?.site);
      addField(fields, "Source", listing.source?.url, listing.source?.url);
      addField(fields, "Canonical source", listing.source?.canonical_url, listing.source?.canonical_url);
      addField(fields, "Agent", listing.broker?.agent);
      addField(fields, "Agent profile", listing.broker?.agent_profile_url, listing.broker?.agent_profile_url);
      addField(fields, "Agent license", listing.broker?.agent_license);
      addField(fields, "Agency", listing.broker?.agency);
      addField(fields, "Agency profile", listing.broker?.agency_profile_url, listing.broker?.agency_profile_url);
      addField(fields, "Agency address", listing.broker?.agency_address);
      wrapper.append(fields);

      const videoNodes = mediaGallery(listing, "Videos", listing.videos, "videos", "video");
      if (videoNodes.length) {
        wrapper.append(...videoNodes);
        upgradeVideos();
      }

      if (listing.property?.description) {
        const heading = document.createElement("h2");
        heading.textContent = "Description";
        const description = document.createElement("p");
        description.className = "description";
        description.textContent = listing.property.description;
        wrapper.append(heading, description);
      }
      if (listing.property?.features?.length) {
        const heading = document.createElement("h2");
        heading.textContent = `Features (${listing.property.features.length})`;
        const features = document.createElement("ul");
        features.className = "features";
        listing.property.features.forEach(value => {
          const item = document.createElement("li");
          item.textContent = value;
          features.append(item);
        });
        wrapper.append(heading, features);
      }
      const videoDetailsNode = mediaDetails("Video files and download status", listing.videos, "videos");
      if (videoDetailsNode) wrapper.append(videoDetailsNode);
      const imageDetailsNode = mediaDetails("Image files and download status", listing.images, "images");
      if (imageDetailsNode) wrapper.append(imageDetailsNode);
      if (listing.warnings?.length) {
        const details = document.createElement("details");
        details.dataset.kind = "warnings";
        const summary = document.createElement("summary");
        summary.textContent = `Warnings (${listing.warnings.length})`;
        const warnings = document.createElement("ul");
        listing.warnings.forEach(value => {
          const item = document.createElement("li");
          item.className = "warning-item";
          item.textContent = value;
          warnings.append(item);
        });
        details.append(summary, warnings);
        wrapper.append(details);
      }
      const imageNodes = mediaGallery(listing, "Images", listing.images, "images", "img");
      content.prepend(wrapper);
      if (imageNodes.length) content.append(...imageNodes);
      applyListingFilter("all");
    };
    const section = (title, entries, directory) => {
      if (!entries.length) return null;
      const wrapper = document.createElement("section");
      const heading = document.createElement("h2");
      heading.textContent = `${title} (${entries.length})`;
      const list = document.createElement("ul");
      entries.forEach(entry => {
        const item = document.createElement("li");
        const link = document.createElement("a");
        link.href = entry.href;
        const kind = document.createElement("span");
        kind.className = "kind";
        kind.textContent = directory ? "DIR" : "FILE";
        const name = document.createElement("span");
        name.className = "name";
        name.append(escapeText(entry.name));
        link.append(kind, name);
        if (!directory) {
          const meta = document.createElement("span");
          meta.className = "meta";
          meta.textContent = formatBytes(entry.size);
          link.append(meta);
        }
        item.append(link);
        list.append(item);
      });
      wrapper.append(heading, list);
      return wrapper;
    };
    const render = index => {
      document.title = `${index.path || "Archive"} · Listing archive`;
      document.querySelector("#path").textContent = displayPath(index.path);
      if (index.parent) {
        const parent = document.querySelector("#parent");
        parent.href = index.parent;
        parent.hidden = false;
      }
      content.replaceChildren();
      const directories = section("Directories", index.directories || [], true);
      const files = section("Files", index.files || [], false);
      if (directories) content.append(directories);
      if (files) content.append(files);
      if (!directories && !files) content.textContent = "This directory is empty.";
      document.querySelector("#updated").textContent = `Index updated ${index.last_updated}`;
    };
    const showError = error => {
      content.innerHTML = "";
      const message = document.createElement("p");
      message.id = "error";
      message.textContent = `Could not load index.json or index.js: ${error.message}\n\nVerify that index.html, index.json, and index.js are in the same directory, then rebuild the archive indexes.`;
      content.append(message);
    };
    const loadScriptFallback = () => new Promise((resolve, reject) => {
      const script = document.createElement("script");
      script.src = "./index.js";
      script.onload = () => window.listingArchiveIndex
        ? resolve(window.listingArchiveIndex)
        : reject(new Error("index.js did not define listingArchiveIndex"));
      script.onerror = () => reject(new Error("index.js could not be loaded"));
      document.head.append(script);
    });
    const loadListingScriptFallback = () => new Promise((resolve, reject) => {
      const script = document.createElement("script");
      script.src = "./listing.js";
      script.onload = () => window.listingArchiveListing
        ? resolve(window.listingArchiveListing)
        : reject(new Error("listing.js did not define listingArchiveListing"));
      script.onerror = () => reject(new Error("listing.js could not be loaded"));
      document.head.append(script);
    });
    const loadListing = index => {
      if (!(index.files || []).some(file => file.name === "listing.json")) return Promise.resolve();
      return fetch("./listing.json", { cache: "no-store" })
        .then(response => {
          if (!response.ok) throw new Error(`listing.json returned HTTP ${response.status}`);
          return response.json();
        })
        .catch(() => loadListingScriptFallback())
        .then(renderListing);
    };
    fetch("./index.json", { cache: "no-store" })
      .then(response => {
        if (!response.ok) throw new Error(`index.json returned HTTP ${response.status}`);
        return response.json();
      })
      .catch(() => loadScriptFallback())
      .then(index => {
        render(index);
        return loadListing(index).catch(error => {
          const message = document.createElement("p");
          message.id = "error";
          message.textContent = `Could not load listing.json or listing.js: ${error.message}`;
          content.prepend(message);
        });
      })
      .catch(showError);
  </script>
</body>
</html>
